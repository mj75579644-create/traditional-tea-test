<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe3cf">
<title>전통차 테스트</title>
<style>
:root{--bg:#f2eee3;--ink:#26352d;--muted:#746f64;--green:#405c49;--card:#fffdf7;--line:#d9d2c2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e9e6de;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink)}
.app{width:min(100%,430px);min-height:100dvh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
.screen{display:none;min-height:100dvh;padding:26px 24px 34px}.screen.active{display:flex;flex-direction:column}

/* Uploaded reference becomes the actual mobile landing page */
#home{padding:0;background:#efe3cf;position:relative;align-items:stretch;justify-content:stretch}
.home-art{display:block;width:100%;height:100dvh;object-fit:cover;object-position:center}
.home-hotspot{
 position:absolute;left:50%;transform:translateX(-50%);
 bottom:8.5%;width:48%;height:8.5%;
 border:0;border-radius:999px;background:transparent;cursor:pointer;
 -webkit-tap-highlight-color:transparent
}
.home-hotspot:focus-visible{outline:3px solid rgba(66,48,37,.45);outline-offset:4px}

.btn{border:0;border-radius:14px;background:var(--green);color:white;font-size:18px;font-weight:800;padding:17px 22px;width:100%;box-shadow:0 8px 18px #344d3b2b;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.progress{height:7px;background:#ded8ca;border-radius:99px;overflow:hidden;margin-bottom:34px}.bar{height:100%;width:10%;background:#66806b;transition:.3s}
.qnum{font-size:14px;color:#718073;font-weight:800;margin-bottom:9px}.question{font-family:Georgia,"Noto Serif KR",serif;font-size:27px;line-height:1.42;letter-spacing:-.04em;margin:0 0 26px}
.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:17px;padding:18px 17px;font-size:16px;line-height:1.45;color:#303b34;cursor:pointer;box-shadow:0 4px 12px #756c5820}.answer:active{transform:scale(.985);background:#f7f2e7}
.result{justify-content:center;text-align:center}.badge{font-size:13px;letter-spacing:.12em;color:#6e806f;font-weight:800}.tea-icon{font-size:76px;margin:19px 0 8px}.result h2{font-family:Georgia,"Noto Serif KR",serif;font-size:39px;margin:0 0 13px}.result p{color:#625f57;line-height:1.75;margin:0 auto 25px;max-width:330px}.traits{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:30px}.traits span{background:#e2e6da;color:#455746;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:700}
#teaDesc{white-space:pre-line;text-align:left}.result .result-headline{font-weight:800;color:var(--green);margin-bottom:18px}
.secondary{margin-top:10px;background:transparent;color:var(--green);border:1px solid #9baa9c;box-shadow:none}
</style>
</head>

</main>
<script>
const questions=[
  [
    "산책 중 반려견이 처음 보는 강아지를 만났다!",
    [
      "먼저 다가가서 꼬리를 흔든다.",
      "주변을 살피며 천천히 접근한다.",
      "관심은 있지만 적당한 거리를 유지한다.",
      "보호자 옆에 붙어 상황을 지켜본다."
    ]
  ],
  [
    "집에 손님이 놀러 왔을 때 반려견의 반응은?",
    [
      "신나서 온 집안을 뛰어다닌다.",
      "냄새를 맡으며 탐색 모드에 들어간다.",
      "적당히 인사한 뒤 자기 할 일을 한다.",
      "조용히 옆에 앉아 손님을 관찰한다."
    ]
  ],
  [
    "가장 좋아하는 휴일의 모습은?",
    [
      "새로운 장소로 나들이 가기",
      "취미 생활이나 새로운 경험하기",

    ]
  ],
  [

    [
      "흥분해서 계속 움직인다.",
      "언제 받을지 계산하며 집중한다.",
      "금방 기다리지만 살짝 재촉한다.",
      "차분하게 기다린다."
    ]
  ],
  [
    "반려견에게 가장 중요해 보이는 것은?",
    [
      "즐거움과 모험",
      "호기심과 성장",
      "안정감과 편안함",
      "신뢰와 교감"
    ]
  ]
];
const results=[
  {
    "name": "보리차 타입",
    "icon": "🌾",
    "headline": "누구와도 편하게 어울리는 국민 강아지",
    "desc": [
      "친화력이 좋고 사람들에게 호감을 산다.",
      "꾸밈없는 매력으로 주변을 편안하게 만든다.",
      "적응력이 뛰어나 어디서든 자연스럽게 녹아든다.",
      "특별히 튀진 않지만 오래 함께할수록 진가가 드러난다."
    ],
    "traits": [
      "친화력",
      "꾸밈없는 매력",
      "적응력"
    ]
  },
  {
    "name": "작두콩차 타입",
    "icon": "🫘",
    "headline": "강단 있고 개성 넘치는 리더견",
    "desc": [
      "호기심이 많고 새로운 도전을 즐긴다.",
      "자기 주관이 뚜렷하다.",
      "처음엔 낯설 수 있지만 알수록 매력적이다.",

      "개성",
      "추진력"
    ]
  },
  {
    "name": "현미차 타입",
    "icon": "🌾",
    "headline": "소소한 행복을 아는 현실주의 강아지",
    "desc": [
      "안정감을 중요하게 생각한다.",
      "계획적이고 책임감이 강하다.",
      "주변 사람들을 세심하게 챙긴다.",
      "화려함보다 실속을 추구한다."
    ],
    "traits": [
      "안정감",
      "책임감",
      "실속"
    ]
  },
  {
    "name": "둥글레차 타입",
    "icon": "🌿",
    "headline": "차분함 속에 깊이가 있는 힐링견",
    "desc": [
      "감수성이 풍부하고 배려심이 많다.",
      "사람들의 이야기를 잘 들어준다.",
      "평화로운 분위기를 좋아한다.",
      "조용하지만 존재감 있는 타입이다."
    ],
    "traits": [
      "차분함",
      "배려심",
      "교감"
    ]
  }
];
let idx=0,scores=[0,0,0,0];
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");scrollTo(0,0)}
function start(){idx=0;scores=[0,0,0,0];show("quiz");render()}
function render(){
 const q=questions[idx]; document.getElementById("count").textContent=`${idx+1} / ${questions.length}`;
 document.getElementById("qnum").textContent=`QUESTION ${String(idx+1).padStart(2,"0")}`;
 document.getElementById("bar").style.width=`${(idx+1)/questions.length*100}%`;
 document.getElementById("question").textContent=q[0];
 const box=document.getElementById("answers"); box.innerHTML="";
 q[1].forEach((a,i)=>{let b=document.createElement("button");b.className="answer";b.textContent=`${"ABCD"[i]}. ${a}`;b.onclick=()=>choose(i);box.appendChild(b)})
}
function choose(i){scores[i]++;idx++; if(idx<questions.length)render();else finish()}
function finish(){
 const m=Math.max(...scores), type=scores.indexOf(m),r=results[type];
 document.getElementById("teaIcon").textContent=r.icon;document.getElementById("teaName").textContent=r.name;
 document.getElementById("teaHeadline").textContent=`“${r.headline}”`;
 document.getElementById("teaDesc").textContent=r.desc.join("\n");
 document.getElementById("traits").innerHTML=r.traits.map(x=>`<span># ${x}</span>`).join("");
 show("result")
}
function restart(){show("home")}
async function shareResult(){
 const text=`우리 반려견과 닮은 전통차는 ${document.getElementById("teaName").textContent}!`;
 if(navigator.share){try{await navigator.share({title:"전통차 테스트",text,url:location.href})}catch(e){}}
 else{try{await navigator.clipboard.writeText(text+" "+location.href);alert("결과가 복사되었습니다.")}catch(e){alert(text)}}
}
</script>
